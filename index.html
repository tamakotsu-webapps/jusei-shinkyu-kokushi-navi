<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2f6b4f"><title>柔整鍼灸国試ナビ Prototype 0.3</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--bg:#f4f8f5;--surface:#fff;--text:#1d2a22;--muted:#667269;--line:#dce6df;--primary:#2f6b4f;--soft:#e8f3ed;--danger:#b24d4d;--ok:#2f7c57}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}button,input,select{font:inherit}header{position:sticky;top:0;z-index:8;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}.brand{font-weight:800;font-size:18px}.sub{font-size:11px;color:var(--muted)}main{max-width:720px;margin:auto;padding:16px 14px 48px}.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:12px;box-shadow:0 6px 24px rgba(26,54,39,.06)}h1{font-size:27px;line-height:1.35;margin:6px 0 10px}h2{font-size:21px;line-height:1.55}p{line-height:1.7}.muted{color:var(--muted)}.tiny{font-size:11px;color:var(--muted);line-height:1.6}.eyebrow{font-size:12px;color:var(--primary);font-weight:800}.btn{border:0;border-radius:13px;padding:13px 15px;font-weight:800;cursor:pointer}.primary{background:var(--primary);color:#fff}.secondary{background:#edf3ef;color:var(--text)}.full{width:100%}.big{font-size:19px;padding:17px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.stat{text-align:center;padding:14px 8px}.stat b{display:block;font-size:22px}.stat span{font-size:11px;color:var(--muted)}.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.menu button{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px;text-align:left;font-weight:800;color:var(--text)}.menu button small{display:block;color:var(--muted);font-weight:500;margin-top:5px}label{display:block;font-weight:800;margin:14px 0}select,input{display:block;width:100%;margin-top:7px;padding:12px 13px;border:1px solid var(--line);border-radius:12px;background:#fff}.tags{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 8px}.tag{background:var(--soft);color:var(--primary);border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800}.options{display:grid;gap:9px;margin:15px 0}.option{background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px;text-align:left;line-height:1.55}.option.correct{background:#eef9f2;border-color:var(--ok)}.option.wrong{background:#fff2f2;border-color:var(--danger)}.hidden{display:none!important}.explain{background:#f1f6f3;border-radius:13px;padding:15px;line-height:1.7;margin:14px 0}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px}.list{display:grid;gap:8px}.listbtn{width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px}.status{font-size:11px;color:var(--muted)}@media(min-width:640px){.menu{grid-template-columns:repeat(3,1fr)}}
</style></head><body><header><div><div class="brand">柔整鍼灸国試ナビ</div><div class="sub">Prototype 0.3</div></div><button id="settingsBtn" class="btn secondary">設定</button></header><main id="app"><section class="card"><div class="eyebrow">接続中</div><h1>国試ナビを準備しています</h1><p class="muted">Supabaseに接続しています…</p></section></main><script>
const db=window.supabase.createClient("https://bvfiyndfprvwwalhzcmb.supabase.co","sb_publishable_iOxwsPb65bpj_hH8MzdRuw_3t0oEnBn",{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});const app=document.getElementById('app'),$=s=>document.querySelector(s),examLabel=x=>x==='judo'?'柔整':x==='acu'?'鍼灸':'両方',shuffle=a=>[...a].sort(()=>Math.random()-.5);let state={user:null,profile:null,questions:[],session:[],idx:0,todayAttempts:0,favorites:new Set()};const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const jpDate=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo'}).format(new Date());function bounds(){const d=jpDate(),s=new Date(d+'T00:00:00+09:00'),e=new Date(s.getTime()+86400000);return[s.toISOString(),e.toISOString()]}
async function boot(){try{let r=await db.auth.getSession();if(!r.data.session)r=await db.auth.signInAnonymously();if(r.error)throw r.error;state.user=r.data.session.user;let p=await db.from('profiles').select('*').eq('id',state.user.id).maybeSingle();if(p.error)throw p.error;state.profile=p.data;if(!state.profile)return onboarding();await refresh();home()}catch(e){app.innerHTML=`<section class="card"><h1>接続エラー</h1><p class="muted">${esc(e.message)}</p><button class="btn primary full" onclick="location.reload()">再読み込み</button></section>`}}
async function refresh(){let q=db.from('questions').select('*').order('exam_year',{ascending:false}).order('question_number');if(state.profile.exam_type!=='both')q=q.eq('exam_type',state.profile.exam_type);let [qr,fr,ar]=await Promise.all([q,db.from('favorites').select('question_id'),db.from('attempts').select('id',{count:'exact',head:true}).gte('answered_at',bounds()[0]).lt('answered_at',bounds()[1])]);if(qr.error||fr.error||ar.error)throw(qr.error||fr.error||ar.error);state.questions=qr.data||[];state.favorites=new Set((fr.data||[]).map(x=>x.question_id));state.todayAttempts=ar.count||0}
function onboarding(){app.innerHTML=`<section class="card"><div class="eyebrow">初回設定</div><h1>まず3項目だけ</h1><p class="muted">あなたに合った問題表示と学生ニーズ集計に使用します。</p><label>目指している資格<select id="exam"><option value="judo">柔道整復師</option><option value="acu">はり師・きゅう師</option><option value="both">両方</option></select></label><label>学年<select id="grade"><option>1年生</option><option>2年生</option><option>3年生</option><option>4年生</option><option>既卒</option><option>その他</option></select></label><label>学校名 <span class="tiny">任意</span><input id="school" placeholder="例：○○専門学校"></label><button id="save" class="btn primary full">学習を始める</button><p class="tiny">氏名・住所・電話番号は取得しません。</p></section>`;$('#save').onclick=saveProfile}
async function saveProfile(){const row={id:state.user.id,exam_type:$('#exam').value,grade:$('#grade').value,school_name:$('#school').value.trim()||null},r=await db.from('profiles').insert(row);if(r.error)return alert(r.error.message);state.profile=row;await refresh();home()}
async function home(){let a=await db.from('attempts').select('is_correct'),w=await db.from('attempts').select('question_id').eq('is_correct',false);let total=(a.data||[]).length,acc=total?Math.round((a.data||[]).filter(x=>x.is_correct).length/total*100)+'%':'-',wrong=new Set((w.data||[]).map(x=>x.question_id)).size;app.innerHTML=`<section class="card"><div class="eyebrow">今日の学習</div><h1>${esc(state.profile.grade)}｜今日も10問やろう</h1><p class="muted">まず10問。続けられそうならもう10問。</p><button id="random" class="btn primary big full">ランダム10問</button></section><section class="stats"><div class="card stat"><b>${state.todayAttempts}</b><span>今日の回答</span></div><div class="card stat"><b>${acc}</b><span>正答率</span></div><div class="card stat"><b>${wrong}</b><span>復習候補</span></div></section><section class="menu"><button id="year">年度別<small>試験年度から選ぶ</small></button><button id="subject">科目別<small>苦手科目を集中</small></button><button id="wrong">間違えた問題<small>復習する</small></button><button id="favorite">お気に入り<small>保存した問題</small></button><button id="stats">学習成績<small>全体と科目別</small></button><button id="surveyStats">学生ニーズ<small>自分の回答履歴</small></button></section><section class="card"><div class="status">● Supabase同期中</div><p class="tiny">現在の問題は動作確認用サンプルです。公式過去問ではありません。</p></section>`;$('#random').onclick=()=>launch(shuffle(state.questions).slice(0,10));$('#year').onclick=()=>choose('年度別',[...new Set(state.questions.map(x=>x.exam_year))].sort((a,b)=>b-a),v=>launch(state.questions.filter(x=>String(x.exam_year)===String(v))));$('#subject').onclick=()=>choose('科目別',[...new Set(state.questions.map(x=>x.subject))].sort(),v=>launch(state.questions.filter(x=>x.subject===v)));$('#wrong').onclick=wrongQuiz;$('#favorite').onclick=()=>{let q=state.questions.filter(x=>state.favorites.has(x.id));q.length?launch(q):alert('お気に入りはまだありません。')};$('#stats').onclick=stats;$('#surveyStats').onclick=surveyStats}
function choose(t,v,cb){app.innerHTML=`<section class="card"><button id="back" class="btn secondary">← 戻る</button><h1>${t}</h1><div class="list">${v.map(x=>`<button class="listbtn pick" data-v="${esc(x)}">${esc(x)}</button>`).join('')}</div></section>`;$('#back').onclick=home;document.querySelectorAll('.pick').forEach(b=>b.onclick=()=>cb(b.dataset.v))}async function wrongQuiz(){let r=await db.from('attempts').select('question_id').eq('is_correct',false),ids=new Set((r.data||[]).map(x=>x.question_id)),q=state.questions.filter(x=>ids.has(x.id));q.length?launch(q):alert('まだ復習候補はありません。')}function launch(q){state.session=[...q];state.idx=0;showQ()}function options(q){return[q.option_1,q.option_2,q.option_3,q.option_4]}
function showQ(){let q=state.session[state.idx];app.innerHTML=`<section class="card"><div class="toolbar"><button id="quit" class="btn secondary">← 戻る</button><b>${state.idx+1} / ${state.session.length}</b></div><div class="tags"><span class="tag">${examLabel(q.exam_type)}</span><span class="tag">${esc(q.subject)}</span><span class="tag">${q.exam_year}</span></div><h2>${esc(q.question_text)}</h2><div id="opts" class="options"></div><button id="fav" class="btn secondary full">${state.favorites.has(q.id)?'★ お気に入り済み':'☆ お気に入り'}</button><div id="exp" class="explain hidden"></div><button id="next" class="btn primary full hidden">次の問題へ</button></section>`;$('#quit').onclick=home;$('#fav').onclick=()=>favToggle(q);options(q).forEach((o,i)=>{let b=document.createElement('button');b.className='option';b.textContent=`${i+1}. ${o}`;b.onclick=()=>answer(q,i+1);$('#opts').appendChild(b)})}
async function answer(q,c){let bs=[...document.querySelectorAll('.option')],correct=(q.correct_options||[]);bs.forEach(b=>b.disabled=true);correct.forEach(n=>bs[n-1]?.classList.add('correct'));let ok=correct.length===1&&correct[0]===c;if(!ok)bs[c-1]?.classList.add('wrong');let r=await db.from('attempts').insert({user_id:state.user.id,question_id:q.id,selected_options:[c],is_correct:ok});if(r.error)return alert(r.error.message);state.todayAttempts++;$('#exp').classList.remove('hidden');$('#exp').innerHTML=`<b>${ok?'正解！':'不正解'}</b><br>${esc(q.explanation||'解説準備中')}`;$('#next').classList.remove('hidden');$('#next').onclick=nextQ}
async function nextQ(){state.idx++;let k='survey_shown_'+jpDate(),shown=Number(localStorage.getItem(k)||0);if(state.todayAttempts%10===0&&shown<2){localStorage.setItem(k,String(shown+1));return showSurvey(()=>state.idx<state.session.length?showQ():done())}state.idx<state.session.length?showQ():done()}async function showSurvey(doneCb){let since=new Date(Date.now()-30*86400000).toISOString(),[q,r]=await Promise.all([db.from('survey_questions').select('*').eq('is_active',true),db.from('survey_responses').select('survey_question_id').gte('answered_at',since)]);let recent=new Set((r.data||[]).map(x=>x.survey_question_id)),pool=(q.data||[]).filter(x=>!recent.has(x.id));if(!pool.length)pool=q.data||[];if(!pool.length)return doneCb();let s=shuffle(pool)[0];app.innerHTML=`<section class="card"><div class="eyebrow">30秒アンケート</div><h2>${esc(s.question_text)}</h2><div id="sopts" class="options"></div><button id="skip" class="btn secondary full">今回はスキップ</button><p class="tiny">学生向け情報や採用コンテンツ改善の参考に使います。</p></section>`;(s.options||[]).forEach(o=>{let b=document.createElement('button');b.className='option';b.textContent=o;b.onclick=async()=>{let x=await db.from('survey_responses').insert({user_id:state.user.id,survey_question_id:s.id,answer:o,exam_type:state.profile.exam_type,grade:state.profile.grade,school_name:state.profile.school_name});if(x.error)return alert(x.error.message);doneCb()};$('#sopts').appendChild(b)});$('#skip').onclick=doneCb}
async function favToggle(q){let r;if(state.favorites.has(q.id)){r=await db.from('favorites').delete().eq('question_id',q.id);if(!r.error)state.favorites.delete(q.id)}else{r=await db.from('favorites').insert({user_id:state.user.id,question_id:q.id});if(!r.error)state.favorites.add(q.id)}if(r.error)return alert(r.error.message);showQ()}function done(){app.innerHTML=`<section class="card"><div class="eyebrow">学習完了</div><h1>おつかれさまでした！</h1><p class="muted">学習履歴はSupabaseへ保存されました。</p><button id="home" class="btn primary full">ホームへ</button></section>`;$('#home').onclick=home}
async function stats(){let r=await db.from('attempts').select('is_correct,questions(subject)'),m={};(r.data||[]).forEach(x=>{let s=x.questions?.subject||'未分類';m[s]??={n:0,c:0};m[s].n++;if(x.is_correct)m[s].c++});app.innerHTML=`<section class="card"><button id="back" class="btn secondary">← 戻る</button><h1>学習成績</h1>${Object.entries(m).map(([s,v])=>`<p><b>${esc(s)}</b>：${Math.round(v.c/v.n*100)}%（${v.n}問）</p>`).join('')||'<p>まだデータがありません。</p>'}</section>`;$('#back').onclick=home}async function surveyStats(){let r=await db.from('survey_responses').select('answer'),m={};(r.data||[]).forEach(x=>m[x.answer]=(m[x.answer]||0)+1);app.innerHTML=`<section class="card"><button id="back" class="btn secondary">← 戻る</button><h1>学生ニーズ</h1>${Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<p><b>${esc(k)}</b>：${v}件</p>`).join('')||'<p>まだ回答がありません。</p>'}</section>`;$('#back').onclick=home}function settings(){if(!state.profile)return;app.innerHTML=`<section class="card"><button id="back" class="btn secondary">← 戻る</button><h1>設定</h1><p><b>匿名ID：</b>${esc(state.user.id)}</p><p><b>資格：</b>${examLabel(state.profile.exam_type)}</p><p><b>学年：</b>${esc(state.profile.grade)}</p><p><b>学校：</b>${esc(state.profile.school_name||'未登録')}</p></section>`;$('#back').onclick=home}document.getElementById('settingsBtn').onclick=settings;boot();
</script></body></html>
