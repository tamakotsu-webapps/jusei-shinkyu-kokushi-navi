<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#244f3b">
<title>柔整鍼灸国試ナビ｜管理ダッシュボード</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f4f7f5;--surface:#fff;--text:#18231d;--muted:#6a756e;--line:#dbe4de;--primary:#2f6b4f;--soft:#eaf3ed;--danger:#a63d40}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
button,input,select{font:inherit}header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
.brand{font-weight:850}.sub{font-size:11px;color:var(--muted)}main{max-width:1100px;margin:auto;padding:20px 14px 56px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 5px 22px rgba(30,60,44,.05)}
.login{max-width:520px;margin:7vh auto}h1{font-size:27px;margin:.2em 0 .45em}h2{font-size:19px;margin:0 0 14px}p{line-height:1.65}
.muted{color:var(--muted)}.tiny{font-size:11px;color:var(--muted)}label{display:block;font-weight:750;margin:15px 0}
input,select{width:100%;display:block;margin-top:7px;padding:12px 13px;border:1px solid var(--line);border-radius:12px;background:#fff}
.btn{border:0;border-radius:12px;padding:12px 15px;font-weight:800;cursor:pointer}.primary{background:var(--primary);color:#fff}.secondary{background:var(--soft);color:var(--text)}.full{width:100%}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.toolbar select{width:auto;margin:0}.grid{display:grid;gap:12px}.kpis{grid-template-columns:repeat(2,1fr);margin-bottom:12px}
.kpi b{display:block;font-size:28px}.kpi span{font-size:11px;color:var(--muted)}.two{grid-template-columns:1fr;margin-top:12px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:11px;color:var(--muted)}
.bar{height:9px;background:#e8eeea;border-radius:99px;overflow:hidden;min-width:100px}.bar>i{display:block;height:100%;background:var(--primary);border-radius:99px}
.badge{display:inline-block;background:var(--soft);color:var(--primary);border-radius:99px;padding:4px 8px;font-size:11px;font-weight:800}.error{background:#fff0f0;color:#7b2225;border:1px solid #f0c8c8;padding:12px;border-radius:12px;margin:12px 0}.hidden{display:none!important}
@media(min-width:720px){.kpis{grid-template-columns:repeat(5,1fr)}.two{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header>
  <div><div class="brand">柔整鍼灸国試ナビ</div><div class="sub">管理ダッシュボード Prototype 0.4</div></div>
  <button id="logoutBtn" class="btn secondary hidden">ログアウト</button>
</header>
<main>
<section id="loginView" class="card login">
  <div class="badge">管理者専用</div>
  <h1>管理ダッシュボード</h1>
  <p class="muted">Supabase Authで登録した管理者アカウントでログインしてください。</p>
  <div id="loginError" class="error hidden"></div>
  <label>メールアドレス<input id="email" type="email" autocomplete="username"></label>
  <label>パスワード<input id="password" type="password" autocomplete="current-password"></label>
  <button id="loginBtn" class="btn primary full">ログイン</button>
</section>

<section id="dashView" class="hidden">
  <div class="toolbar">
    <select id="days"><option value="7">直近7日</option><option value="30">直近30日</option><option value="90">直近90日</option></select>
    <button id="refreshBtn" class="btn primary">更新</button>
    <span id="loginInfo" class="tiny"></span>
  </div>
  <div id="dashError" class="error hidden"></div>

  <div class="grid kpis">
    <div class="card kpi"><b id="totalUsers">-</b><span>登録学生</span></div>
    <div class="card kpi"><b id="activeUsers">-</b><span>期間内利用者</span></div>
    <div class="card kpi"><b id="attempts">-</b><span>期間内回答</span></div>
    <div class="card kpi"><b id="correctRate">-</b><span>正答率</span></div>
    <div class="card kpi"><b id="surveys">-</b><span>アンケート回答</span></div>
  </div>

  <div class="grid two">
    <section class="card"><h2>資格・学年</h2><div id="profileSummary"></div></section>
    <section class="card"><h2>学校別</h2><div id="schoolSummary"></div></section>
  </div>
  <div class="grid two">
    <section class="card"><h2>学生ニーズ</h2><div id="surveySummary"></div></section>
    <section class="card"><h2>科目別学習</h2><div id="subjectSummary"></div></section>
  </div>
</section>
</main>

<script>
const SUPABASE_URL="https://bvfiyndfprvwwalhzcmb.supabase.co";
const SUPABASE_KEY="sb_publishable_iOxwsPb65bpj_hH8MzdRuw_3t0oEnBn";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,storageKey:"kokushi-navi-admin-auth"}});
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const fmt=n=>new Intl.NumberFormat('ja-JP').format(Number(n||0));
const err=(id,msg)=>{const e=$(id);e.textContent=msg;e.classList.remove('hidden')};
const clear=id=>$(id).classList.add('hidden');

async function login(){
  clear('#loginError');
  const {data,error}=await db.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});
  if(error)return err('#loginError',error.message);
  await enter(data.user);
}
async function enter(user){
  const {data:isAdmin,error}=await db.rpc('is_admin');
  if(error||!isAdmin){await db.auth.signOut();return err('#loginError','このアカウントには管理者権限がありません。')}
  $('#loginView').classList.add('hidden');$('#dashView').classList.remove('hidden');$('#logoutBtn').classList.remove('hidden');
  $('#loginInfo').textContent=user?.email||'';await load();
}
async function load(){
  clear('#dashError');const days=Number($('#days').value);
  const [o,s,sc,sub]=await Promise.all([
    db.rpc('admin_overview',{p_days:days}),
    db.rpc('admin_survey_summary',{p_days:days}),
    db.rpc('admin_school_summary'),
    db.rpc('admin_subject_summary',{p_days:days})
  ]);
  const e=o.error||s.error||sc.error||sub.error;if(e)return err('#dashError',e.message);
  const x=o.data||{};
  $('#totalUsers').textContent=fmt(x.total_users);$('#activeUsers').textContent=fmt(x.active_users);$('#attempts').textContent=fmt(x.period_attempts);$('#correctRate').textContent=`${Number(x.correct_rate||0)}%`;$('#surveys').textContent=fmt(x.period_surveys);
  const g=x.grade_counts||{};
  $('#profileSummary').innerHTML=`<p><b>柔整</b> ${fmt(x.judo_users)}人　<b>鍼灸</b> ${fmt(x.acu_users)}人　<b>両方</b> ${fmt(x.both_users)}人</p><table><thead><tr><th>学年</th><th>人数</th></tr></thead><tbody>${Object.entries(g).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${fmt(v)}</td></tr>`).join('')||'<tr><td colspan="2">データなし</td></tr>'}</tbody></table>`;
  const schools=sc.data||[],sm=Math.max(1,...schools.map(r=>Number(r.student_count||0)));
  $('#schoolSummary').innerHTML=`<table><thead><tr><th>学校</th><th>人数</th><th></th></tr></thead><tbody>${schools.map(r=>`<tr><td>${esc(r.school_name)}</td><td>${fmt(r.student_count)}</td><td><div class="bar"><i style="width:${Math.max(4,Number(r.student_count)/sm*100)}%"></i></div></td></tr>`).join('')||'<tr><td colspan="3">データなし</td></tr>'}</tbody></table>`;
  const surveys=s.data||[],svm=Math.max(1,...surveys.map(r=>Number(r.response_count||0)));
  $('#surveySummary').innerHTML=`<table><thead><tr><th>質問</th><th>回答</th><th>件数</th></tr></thead><tbody>${surveys.map(r=>`<tr><td>${esc(r.question_text)}</td><td>${esc(r.answer)}</td><td>${fmt(r.response_count)}<div class="bar"><i style="width:${Math.max(4,Number(r.response_count)/svm*100)}%"></i></div></td></tr>`).join('')||'<tr><td colspan="3">データなし</td></tr>'}</tbody></table>`;
  const subjects=sub.data||[];
  $('#subjectSummary').innerHTML=`<table><thead><tr><th>科目</th><th>回答</th><th>正答率</th></tr></thead><tbody>${subjects.map(r=>`<tr><td>${esc(r.subject)}</td><td>${fmt(r.attempts_count)}</td><td>${Number(r.correct_rate||0)}%</td></tr>`).join('')||'<tr><td colspan="3">データなし</td></tr>'}</tbody></table>`;
}
async function boot(){const {data:{session}}=await db.auth.getSession();if(session?.user)await enter(session.user)}
$('#loginBtn').onclick=login;$('#password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
$('#refreshBtn').onclick=load;$('#days').onchange=load;$('#logoutBtn').onclick=async()=>{await db.auth.signOut();location.reload()};
boot();
</script>
</body>
</html>
