<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#2f6b4f" />
<title>柔整鍼灸国試ナビ Prototype 0.2</title>
<style>
:root{--bg:#f4f8f5;--surface:#fff;--text:#1d2a22;--muted:#667269;--line:#dce6df;--primary:#2f6b4f;--soft:#e8f3ed;--danger:#b24d4d;--ok:#2f7c57}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}button,input,select{font:inherit}
header{position:sticky;top:0;z-index:9;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line)}
.brand{font-weight:800}.sub{font-size:11px;color:var(--muted)}main{max-width:720px;margin:auto;padding:16px 14px 48px}.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:12px;box-shadow:0 5px 20px rgba(30,70,45,.05)}
h1{font-size:26px;margin:.25em 0}.muted{color:var(--muted);line-height:1.65}.tiny{font-size:11px;color:var(--muted)}.eyebrow{font-size:12px;color:var(--primary);font-weight:800}.btn{border:0;border-radius:13px;padding:13px 15px;font-weight:800;cursor:pointer}.primary{background:var(--primary);color:#fff}.secondary{background:#edf3ef}.full{width:100%}.big{font-size:18px;padding:17px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{text-align:center;padding:14px 8px}.stat b{display:block;font-size:22px}.stat span{font-size:11px;color:var(--muted)}.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.menu button{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px;text-align:left;font-weight:800}.menu small{display:block;color:var(--muted);font-weight:500;margin-top:5px}
label{display:block;font-weight:800;margin:14px 0}select,input{width:100%;margin-top:7px;padding:12px 13px;border:1px solid var(--line);border-radius:12px;background:white}.toolbar{display:flex;justify-content:space-between;align-items:center}.tags{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 8px}.tag{background:var(--soft);color:var(--primary);border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800}.options{display:grid;gap:9px;margin:15px 0}.option{background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px;text-align:left;line-height:1.55}.option.correct{background:#eef9f2;border-color:var(--ok)}.option.wrong{background:#fff2f2;border-color:var(--danger)}.hidden{display:none!important}.explain{background:#f1f6f3;border-radius:13px;padding:15px;line-height:1.7;margin:14px 0}.list{display:grid;gap:8px}.listbtn{width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px}
@media(min-width:640px){.menu{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header><div><div class="brand">柔整鍼灸国試ナビ</div><div class="sub">Prototype 0.2</div></div><button id="settingsBtn" class="btn secondary">設定</button></header>
<main id="app"></main>
<script>
const Q=[
{id:'j1',exam:'judo',year:2026,subject:'解剖学',q:'【サンプル】肩関節の運動に関与する筋として最も適切なのはどれか。',opts:['咬筋','三角筋','前脛骨筋','ヒラメ筋'],ans:1,exp:'三角筋は肩関節の運動に関与します。'},
{id:'j2',exam:'judo',year:2026,subject:'生理学',q:'【サンプル】安静吸気の主要筋はどれか。',opts:['横隔膜','咬筋','大殿筋','上腕三頭筋'],ans:0,exp:'横隔膜は安静吸気の主要筋です。'},
{id:'j3',exam:'judo',year:2025,subject:'解剖学',q:'【サンプル】大腿骨が存在する部位はどれか。',opts:['上腕','前腕','大腿','下腿'],ans:2,exp:'大腿骨は大腿部の長管骨です。'},
{id:'j4',exam:'judo',year:2025,subject:'病理学',q:'【サンプル】炎症徴候として適切なのはどれか。',opts:['発赤','縮瞳','脱毛','徐脈'],ans:0,exp:'発赤は代表的な炎症徴候です。'},
{id:'j5',exam:'judo',year:2024,subject:'柔道整復理論',q:'【サンプル】固定の基本目的として適切なのはどれか。',opts:['患部の安静','必ず筋力を増す','必ず疼痛を消す','必ず骨癒合を早める'],ans:0,exp:'固定の基本目的の一つは患部安静です。'},
{id:'j6',exam:'judo',year:2024,subject:'衛生学',q:'【サンプル】一次予防に近いものはどれか。',opts:['健康教育','後遺症への補装具','再発後の治療','機能回復訓練'],ans:0,exp:'健康教育は一次予防に含まれます。'},
{id:'j7',exam:'judo',year:2023,subject:'臨床医学',q:'【サンプル】バイタルサインに含まれるものはどれか。',opts:['体温','身長','足長','視力のみ'],ans:0,exp:'体温は基本的なバイタルサインです。'},
{id:'j8',exam:'judo',year:2023,subject:'リハビリテーション医学',q:'【サンプル】関節可動域を表す略語はどれか。',opts:['ROM','BMI','ECG','WBC'],ans:0,exp:'ROMはRange of Motionです。'},
{id:'j9',exam:'judo',year:2022,subject:'解剖学',q:'【サンプル】橈骨と尺骨がある部位はどれか。',opts:['前腕','大腿','下腿','骨盤'],ans:0,exp:'橈骨と尺骨は前腕の骨です。'},
{id:'j10',exam:'judo',year:2022,subject:'生理学',q:'【サンプル】血糖調節に関与するホルモンはどれか。',opts:['インスリン','メラトニン','オキシトシン','エリスロポエチン'],ans:0,exp:'インスリンは血糖調節に関与します。'},
{id:'a1',exam:'acu',year:2026,subject:'解剖学',q:'【サンプル】脊柱を構成するものはどれか。',opts:['椎骨','足根骨','手根骨','種子骨'],ans:0,exp:'脊柱は椎骨などから構成されます。'},
{id:'a2',exam:'acu',year:2026,subject:'生理学',q:'【サンプル】全身へ血液を送り出す心腔はどれか。',opts:['左心室','右心房','左心房','右心室'],ans:0,exp:'左心室から大動脈へ血液が拍出されます。'},
{id:'a3',exam:'acu',year:2025,subject:'東洋医学',q:'【サンプル】東洋医学の基本概念の一つはどれか。',opts:['陰陽','BMI','DNA','HbA1c'],ans:0,exp:'陰陽は東洋医学の基本概念です。'},
{id:'a4',exam:'acu',year:2025,subject:'はり・きゅう理論',q:'【サンプル】施術時に基本となる対応はどれか。',opts:['安全確認','説明を省略','刺激量を常に固定','痛みを必ず出す'],ans:0,exp:'安全確認と説明は重要です。'},
{id:'a5',exam:'acu',year:2024,subject:'病理学',q:'【サンプル】浮腫に最も近い状態はどれか。',opts:['組織間液の増加','骨密度の増加','赤血球の消失','関節面の増加'],ans:0,exp:'浮腫は組織間液の過剰貯留です。'},
{id:'a6',exam:'acu',year:2024,subject:'衛生学',q:'【サンプル】基本的な感染対策はどれか。',opts:['手指衛生','器具の共有','換気をしない','手洗いを省略'],ans:0,exp:'手指衛生は基本的感染対策です。'},
{id:'a7',exam:'acu',year:2023,subject:'臨床医学',q:'【サンプル】問診で確認する内容として適切なのはどれか。',opts:['主訴','好きな色のみ','靴のメーカーのみ','血液型のみ'],ans:0,exp:'主訴は問診の基本項目です。'},
{id:'a8',exam:'acu',year:2023,subject:'生理学',q:'【サンプル】骨格筋収縮に関与する代表的なイオンはどれか。',opts:['カルシウム','金','銀','鉛'],ans:0,exp:'カルシウムイオンは筋収縮に関与します。'},
{id:'a9',exam:'acu',year:2022,subject:'東洋医学',q:'【サンプル】四診に含まれるものはどれか。',opts:['望診','MRIのみ','CTのみ','血液検査のみ'],ans:0,exp:'望診は四診の一つです。'},
{id:'a10',exam:'acu',year:2022,subject:'リハビリテーション医学',q:'【サンプル】ADLが意味するものはどれか。',opts:['日常生活動作','血圧','心電図','骨密度'],ans:0,exp:'ADLは日常生活動作です。'}
];
const S=[
{id:'s1',cat:'情報発信',q:'今、一番知りたい学生向け情報は？',opts:['国家試験対策','治療技術・実技','就職先の選び方','新人研修','学生バイト・インターン','先輩スタッフの話']},
{id:'s2',cat:'就職',q:'就職先を選ぶ時、一番気になるのは？',opts:['給与','勤務時間・休日','人間関係','教育制度','治療技術','将来性']},
{id:'s3',cat:'見学',q:'院見学で一番知りたいことは？',opts:['実際の施術','スタッフの雰囲気','新人教育','1日の流れ','給与・休日','キャリア']},
{id:'s4',cat:'学生生活',q:'学生のうちに経験してみたいものは？',opts:['整骨院アルバイト','インターン','トレーナー活動','勉強会','現場見学','まだ分からない']},
{id:'s5',cat:'学習',q:'国試勉強で今一番困っていることは？',opts:['何から始めるか','暗記','苦手科目','過去問の使い方','勉強時間','特に困っていない']}
];
const app=document.getElementById('app'),$=s=>document.querySelector(s);const Store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){localStorage.setItem(k,JSON.stringify(v))}};const day=()=>new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Tokyo'});const profile=()=>Store.get('profile',null),attempts=()=>Store.get('attempts',[]),favorites=()=>Store.get('favorites',[]),surveyResponses=()=>Store.get('surveyResponses',[]);const examLabel=x=>x==='judo'?'柔整':x==='acu'?'鍼灸':'両方';const shuffle=a=>[...a].sort(()=>Math.random()-.5);const uid=()=> 'u_'+Math.random().toString(36).slice(2,10).toUpperCase();
function boot(){profile()?home():onboarding()}
function onboarding(){app.innerHTML=`<section class="card"><div class="eyebrow">初回設定</div><h1>まず3項目だけ</h1><p class="muted">あなたに合った問題表示と学生ニーズ集計に使用します。</p><label>目指している資格<select id="exam"><option value="judo">柔道整復師</option><option value="acu">はり師・きゅう師</option><option value="both">両方</option></select></label><label>学年<select id="grade"><option>1年生</option><option>2年生</option><option>3年生</option><option>4年生</option><option>既卒</option><option>その他</option></select></label><label>学校名 <span class="tiny">任意</span><input id="school" placeholder="例：○○専門学校"></label><button id="save" class="btn primary full">学習を始める</button><p class="tiny">氏名・住所・電話番号は取得しません。</p></section>`;$('#save').onclick=()=>{Store.set('profile',{id:uid(),exam:$('#exam').value,grade:$('#grade').value,school:$('#school').value.trim(),createdAt:new Date().toISOString()});home()}}
function allowed(){const p=profile();return p.exam==='both'?Q:Q.filter(q=>q.exam===p.exam)}
function home(){const a=attempts(),t=a.filter(x=>x.date===day()),wrong=[...new Set(a.filter(x=>!x.correct).map(x=>x.qid))],acc=a.length?Math.round(a.filter(x=>x.correct).length/a.length*100)+'%':'-';app.innerHTML=`<section class="card"><div class="eyebrow">今日の学習</div><h1>${profile().grade}｜今日も10問やろう</h1><p class="muted">まず10問。続けられそうならもう10問。</p><button id="random10" class="btn primary big full">ランダム10問</button></section><section class="stats"><div class="card stat"><b>${t.length}</b><span>今日の回答</span></div><div class="card stat"><b>${acc}</b><span>正答率</span></div><div class="card stat"><b>${wrong.length}</b><span>復習候補</span></div></section><section class="menu"><button id="year">年度別<small>試験年度から選ぶ</small></button><button id="subject">科目別<small>苦手科目を集中</small></button><button id="wrong">間違えた問題<small>復習する</small></button><button id="favorite">お気に入り<small>保存した問題</small></button><button id="stats">学習成績<small>全体と科目別</small></button><button id="surveyStats">学生ニーズ<small>アンケート集計</small></button></section><section class="card"><b>Prototype 0.2</b><p class="muted">現在の20問は操作確認用サンプルです。公式過去問ではありません。</p></section>`;$('#random10').onclick=()=>launch(shuffle(allowed()).slice(0,10));$('#wrong').onclick=()=>{const ids=[...new Set(attempts().filter(x=>!x.correct).map(x=>x.qid))],qs=allowed().filter(x=>ids.includes(x.id));qs.length?launch(qs):alert('まだ復習候補はありません。')};$('#favorite').onclick=()=>{const qs=allowed().filter(x=>favorites().includes(x.id));qs.length?launch(qs):alert('お気に入りはまだありません。')};$('#year').onclick=()=>chooser('年度別',[...new Set(allowed().map(x=>x.year))].sort((a,b)=>b-a),v=>launch(allowed().filter(x=>x.year==v)));$('#subject').onclick=()=>chooser('科目別',[...new Set(allowed().map(x=>x.subject))].sort(),v=>launch(allowed().filter(x=>x.subject===v)));$('#stats').onclick=renderStats;$('#surveyStats').onclick=renderSurveyStats}
function chooser(title,vals,cb){app.innerHTML=`<section class="card"><button id="back" class="btn secondary">← 戻る</button><h1>${title}</h1><div class="list">${vals.map(v=>`<button class="listbtn choose" data-v="${v}">${v}</button>`).join('')}</div></section>`;$('#back').onclick=home;document.querySelectorAll('.choose').forEach(b=>b.onclick=()=>cb(b.dataset.v))}
let session={qs:[],i:0};function launch(qs){session={qs:[...qs],i:0};showQ()}
function showQ(){const q=session.qs[session.i];app.innerHTML=`<section class="card"><div class="toolbar"><button id="quit" class="btn secondary">← 戻る</button><b>${session.i+1} / ${session.qs.length}</b></div><div class="tags"><span class="tag">${examLabel(q.exam)}</span><span class="tag">${q.subject}</span><span class="tag">${q.year}</span></div><h2>${q.q}</h2><div id="options" class="options"></div><button id="favBtn" class="btn secondary full">${favorites().includes(q.id)?'★ お気に入り済み':'☆ お気に入り'}</button><div id="exp" class="explain hidden"></div><button id="next" class="btn primary full hidden">次の問題へ</button></section>`;$('#quit').onclick=home;$('#favBtn').onclick=()=>{let f=favorites();f=f.includes(q.id)?f.filter(x=>x!==q.id):[...f,q.id];Store.set('favorites',f);showQ()};q.opts.forEach((opt,i)=>{const b=document.createElement('button');b.className='option';b.textContent=`${i+1}. ${opt}`;b.onclick=()=>answer(q,i);$('#options').appendChild(b)})}
function answer(q,sel){const bs=[...document.querySelectorAll('.option')];bs.forEach(b=>b.disabled=true);bs[q.ans].classList.add('correct');if(sel!==q.ans)bs[sel].classList.add('wrong');const correct=sel===q.ans,a=attempts();a.push({qid:q.id,exam:q.exam,subject:q.subject,year:q.year,selected:sel,correct,date:day(),ts:new Date().toISOString()});Store.set('attempts',a);$('#exp').classList.remove('hidden');$('#exp').innerHTML=`<b>${correct?'正解！':'不正解'}</b><br>${q.exp}<br><span class="tiny">※Prototype用サンプル解説</span>`;$('#next').classList.remove('hidden');$('#next').onclick=nextQ}
function nextQ(){session.i++;if(shouldSurvey())return survey(()=>session.i<session.qs.length?showQ():done());session.i<session.qs.length?showQ():done()}
function shouldSurvey(){const n=attempts().filter(x=>x.date===day()).length,s=surveyResponses().filter(x=>x.date===day()).length;return s<2&&n>0&&n%10===0}
function survey(doneCb){const recent=surveyResponses().filter(x=>(Date.now()-new Date(x.ts))/86400000<30).map(x=>x.sid);let pool=S.filter(x=>!recent.includes(x.id));if(!pool.length)pool=S;const s=shuffle(pool)[0];app.innerHTML=`<section class="card"><div class="eyebrow">30秒アンケート</div><h2>${s.q}</h2><div id="surveyOptions" class="options"></div><button id="skip" class="btn secondary full">今回はスキップ</button><p class="tiny">学生向け情報や採用コンテンツ改善の参考に使います。</p></section>`;s.opts.forEach(opt=>{const b=document.createElement('button');b.className='option';b.textContent=opt;b.onclick=()=>{const p=profile(),r=surveyResponses();r.push({sid:s.id,category:s.cat,answer:opt,userId:p.id,exam:p.exam,grade:p.grade,school:p.school||'',date:day(),ts:new Date().toISOString()});Store.set('surveyResponses',r);doneCb()};$('#surveyOptions').appendChild(b)});$('#skip').onclick=doneCb}
function done(){app.innerHTML=`<section class="card"><div class="eyebrow">学習完了</div><h1>おつかれさまでした！</h1><p class="muted">間違えた問題はホームから復習できます。</p><button id="homeBtn" class="btn primary full">ホームへ</button></section>`;$('#homeBtn').onclick=home}
function renderStats(){const a=attempts(),subs=[...new Set(a.map(x=>x.subject))];app.innerHTML=`<section class="card"><button id="back" class="btn secondary">← 戻る</button><h1>学習成績</h1>${subs.map(s=>{const x=a.filter(v=>v.subject===s),rate=Math.round(x.filter(v=>v.correct).length/x.length*100);return `<p><b>${s}</b>：${rate}%（${x.length}問）</p>`}).join('')||'<p class="muted">まだ回答データがありません。</p>'}</section>`;$('#back').onclick=home}
function renderSurveyStats(){const r=surveyResponses(),c={};r.forEach(x=>c[x.answer]=(c[x.answer]||0)+1);app.innerHTML=`<section class="card"><button id="back" class="btn secondary">← 戻る</button><h1>学生ニーズ</h1><p class="muted">この端末内の簡易集計です。</p>${Object.entries(c).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<p><b>${k}</b>：${v}件</p>`).join('')||'<p>まだ回答がありません。</p>'}</section>`;$('#back').onclick=home}
function settings(){const p=profile();if(!p)return;app.innerHTML=`<section class="card"><button id="back" class="btn secondary">← 戻る</button><h1>設定</h1><p><b>匿名ID：</b>${p.id}</p><p><b>資格：</b>${examLabel(p.exam)}</p><p><b>学年：</b>${p.grade}</p><p><b>学校：</b>${p.school||'未登録'}</p><button id="reset" class="btn secondary full">この端末を初期化</button></section>`;$('#back').onclick=home;$('#reset').onclick=()=>{if(confirm('学習履歴も含めて初期化しますか？')){localStorage.clear();boot()}}}
document.getElementById('settingsBtn').onclick=settings;boot();
</script>
</body></html>
